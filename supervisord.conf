; supervisord.conf — Firefly III Cost Explorer single-image
;
; Runs:
;   1. nginx   — foreground, serves SPA on :8080
;   2. sidecar — node rates-sidecar, background cron + polling
;
; Both processes propagate stdout/stderr to the container's stdout,
; so `docker logs firefly-iii-cost-explorer` shows interleaved lines
; prefixed by supervisord with "[program:nginx]" / "[program:sidecar]".

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root
priority=10

[program:sidecar]
command=/usr/local/bin/node /sidecar/index.js
directory=/sidecar
autostart=true
autorestart=true
startretries=5
startsecs=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
; Environment is inherited from supervisord, which inherits from docker.
; FIREFLY_URL, FIREFLY_PAT, TZ, LOG_LEVEL, CONFIG_POLL_INTERVAL_MS,
; and optionally NODE_EXTRA_CA_CERTS are injected at container-start time
; via `environment:` in docker-compose.
user=node
priority=20

[eventlistener:fatalsubscriber]
; Kills the container if either program enters FATAL state (exceeded
; startretries). Portainer then restarts the container per its policy.
command=sh -c 'printf "READY\n" && while read line; do echo "$line" 1>&2; kill -SIGTERM $PPID; done'
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
